name: Build APK dari HP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/build-apk-hp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Periksa index.html
        run: |
          test -f index.html
          echo "File aplikasi ditemukan:"
          ls -lh index.html

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buat proyek Android sementara
        run: |
          mkdir -p android/app/src/main/java/com/rutinitas/plus
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RutinitasPlus"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rutinitas.plus'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rutinitas.plus'
                  minSdk 24
                  targetSdk 35
                  versionCode 34
                  versionName '0.3.4'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Rutinitas+"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#233A1F</item>
                  <item name="android:navigationBarColor">#F7F8F3</item>
                  <item name="android:colorAccent">#35502F</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/rutinitas/plus/MainActivity.java <<'EOF'
          package com.rutinitas.plus;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = filePathCallback;

                          try {
                              startActivityForResult(
                                  fileChooserParams.createIntent(),
                                  FILE_CHOOSER_REQUEST
                              );
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      Uri[] result =
                          WebChromeClient.FileChooserParams.parseResult(resultCode, data);

                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(result);
                      }

                      fileCallback = null;
                      return;
                  }

                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Ubah nama APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             Rutinitas-Harian-v034-Plus-Laporan-Rehab.apk
          ls -lh Rutinitas-Harian-v034-Plus-Laporan-Rehab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Harian-v034-Plus-Laporan-Rehab-APK
          path: Rutinitas-Harian-v034-Plus-Laporan-Rehab.apk
          if-no-files-found: error
          retention-days: 30
