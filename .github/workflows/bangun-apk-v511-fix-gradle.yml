name: Bangun APK Rutinitas Plus v5.15 — Mesin Pekerjaan Terpadu

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "index.html"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Periksa index.html
        shell: bash
        run: |
          set -e
          test -s index.html
          grep -q "Rutinitas+" index.html
          grep -q "PUSTAKA_BERSAMA" index.html
          grep -q "PEKERJAAN_DASAR" index.html
          grep -q "pasangPustaka" index.html
          VERSI=$(grep -oE "Rutinitas\+ v[0-9]+\.[0-9]+(\.[0-9]+)?" index.html | head -n1)
          echo "index.html lolos pemeriksaan. Versi terdeteksi: ${VERSI:-tidak diketahui}"

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buat proyek Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rutinitasplus/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cp index.html app/src/main/assets/index.html

          # Aset PWA bersifat opsional untuk APK. Bila ada di repositori,
          # aset tersebut ikut disajikan dari origin HTTPS internal yang sama.
          for f in manifest.webmanifest sw.js ikon-192.png ikon-512.png                    ikon-maskable-512.png apple-touch-icon.png; do
              if [ -s "$f" ]; then
                  cp "$f" app/src/main/assets/"$f"
              fi
          done

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RutinitasPlus"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace = "com.rutinitasplus.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.rutinitasplus.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = (System.getenv("KODE_VERSI") ?: "515").toInteger()
                  versionName = System.getenv("NAMA_VERSI") ?: "5.15"
              }

              signingConfigs {
                  rilis {
                      if (System.getenv("BERKAS_KUNCI")) {
                          storeFile = file(System.getenv("BERKAS_KUNCI"))
                          storePassword = System.getenv("SANDI_KUNCI")
                          keyAlias = System.getenv("ALIAS_KUNCI")
                          keyPassword = System.getenv("SANDI_ALIAS")
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled = false
                      if (System.getenv("BERKAS_KUNCI")) {
                          signingConfig = signingConfigs.rilis
                      }
                  }
              }
          }

          dependencies {
              implementation "androidx.core:core:1.13.1"
              implementation "androidx.webkit:webkit:1.11.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <application
                  android:allowBackup="true"
                  android:label="Rutinitas+"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <receiver
                      android:name=".AlarmReceiver"
                      android:enabled="true"
                      android:exported="false"/>

              <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="camera_images" path="images/"/>
          </paths>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#35502F</item>
                  <item name="android:navigationBarColor">#F7F8F3</item>
                  <item name="android:statusBarColor">#1E3419</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/rutinitasplus/app/NotificationBridge.java <<'EOF'
          package com.rutinitasplus.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;

          /* Jembatan penjadwal notifikasi native, sepola dengan ShareBridge dan
             DownloadBridge. ID pengingat di aplikasi web berupa string (mis.
             'p1a2b3c4' atau 'i1786627096206kvya'), bukan angka kecil -- jadi
             dipakai String di sini, diubah jadi kode stabil lewat hashCode()
             untuk PendingIntent dan ID notifikasi. */
          public class NotificationBridge {
              private final MainActivity aktivitas;

              public NotificationBridge(MainActivity aktivitas) {
                  this.aktivitas = aktivitas;
              }

              private static int kode(String id) {
                  return (id == null ? "rutinitas" : id).hashCode();
              }

              private PendingIntent buatPendingIntent(String id) {
                  Intent intent = new Intent(aktivitas, AlarmReceiver.class);
                  int kodeNotif = kode(id);
                  intent.putExtra("kode", kodeNotif);
                  return PendingIntent.getBroadcast(
                      aktivitas, kodeNotif, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              @JavascriptInterface
              public void jadwalkan(String id, String judul, String pesan, double timestampMs) {
                  if (id == null || id.isEmpty()) return;
                  AlarmManager am = (AlarmManager) aktivitas.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;

                  Intent intent = new Intent(aktivitas, AlarmReceiver.class);
                  int kodeNotif = kode(id);
                  intent.putExtra("kode", kodeNotif);
                  intent.putExtra("judul", judul);
                  intent.putExtra("pesan", pesan);
                  PendingIntent pi = PendingIntent.getBroadcast(
                      aktivitas, kodeNotif, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  aktivitas.runOnUiThread(() -> {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) {
                              /* Android 12+ mewajibkan izin ini diberikan lewat Pengaturan --
                                 tidak bisa otomatis dari dalam aplikasi. Jadwalkan tidak-presisi
                                 sebagai jalan tengah, supaya tetap berbunyi meski agak meleset. */
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, (long) timestampMs, pi);
                              return;
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, (long) timestampMs, pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, (long) timestampMs, pi);
                          }
                      } catch (SecurityException e) {
                          try { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, (long) timestampMs, pi); }
                          catch (Exception e2) { /* diamkan -- lebih baik tanpa alarm daripada aplikasi berhenti */ }
                      }
                  });
              }

              @JavascriptInterface
              public void batalkan(String id) {
                  if (id == null || id.isEmpty()) return;
                  AlarmManager am = (AlarmManager) aktivitas.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  PendingIntent pi = buatPendingIntent(id);
                  aktivitas.runOnUiThread(() -> am.cancel(pi));
              }

              /* true bila alarm presisi diizinkan sistem (selalu true di bawah Android 12) */
              @JavascriptInterface
              public boolean bisaPresisi() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return true;
                  AlarmManager am = (AlarmManager) aktivitas.getSystemService(Context.ALARM_SERVICE);
                  return am != null && am.canScheduleExactAlarms();
              }

              /* Membuka layar Pengaturan tempat pengguna mengizinkan alarm presisi.
                 Hanya berarti pada Android 12 ke atas. */
              @JavascriptInterface
              public void bukaPengaturanAlarm() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return;
                  aktivitas.runOnUiThread(() -> {
                      try {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                          intent.setData(Uri.parse("package:" + aktivitas.getPackageName()));
                          aktivitas.startActivity(intent);
                      } catch (Exception e) { /* diamkan */ }
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/rutinitasplus/app/AlarmReceiver.java <<'EOF'
          package com.rutinitasplus.app;

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;

          /* Menangkap alarm dari AlarmManager -- termasuk saat HP dalam mode
             tidur -- dan menampilkan notifikasi. Dipicu lewat NotificationBridge,
             dijadwalkan dari JavaScript. */
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  int kodeNotif = intent.getIntExtra("kode", 0);
                  String judul = intent.getStringExtra("judul");
                  String pesan = intent.getStringExtra("pesan");

                  NotificationManager nm =
                      (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  Intent bukaApp = new Intent(context, MainActivity.class);
                  bukaApp.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      context, kodeNotif, bukaApp,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(context, "rutinitas_channel")
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setContentTitle(judul != null && !judul.isEmpty() ? judul : "Rutinitas+")
                      .setContentText(pesan != null && !pesan.isEmpty() ? pesan : "Saatnya menjalankan rutinitas.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  nm.notify(kodeNotif, b.build());
              }
          }
          EOF

          cat > app/src/main/java/com/rutinitasplus/app/MainActivity.java <<'EOF'
          package com.rutinitasplus.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;
          import androidx.core.view.WindowCompat;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.File;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int SAVE_FILE_REQUEST = 1002;

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraOutputUri;

              private byte[] pendingDownloadBytes;
              private String pendingDownloadName = "Rutinitas-Plus";
              private String pendingDownloadMime = "application/octet-stream";

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowFileAccessFromFileURLs(false);
                  settings.setAllowUniversalAccessFromFileURLs(false);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new DownloadBridge(), "AndroidDownload");
                  webView.addJavascriptInterface(new ShareBridge(), "AndroidShare");
                  webView.addJavascriptInterface(new NotificationBridge(this), "AndroidNotif");
                  siapkanKanalNotifikasi();
                  mintaIzinNotifikasi();

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .setDomain("appassets.androidplatform.net")
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          installDownloadHandler();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams
                      ) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = filePathCallback;
                          cameraOutputUri = null;

                          FileRequestType requestType = detectRequestType(fileChooserParams);

                          Intent chooser;

                          if (requestType == FileRequestType.PHOTO) {
                              chooser = buildPhotoChooser(fileChooserParams);
                          } else if (requestType == FileRequestType.BACKUP) {
                              chooser = buildBackupChooser();
                          } else {
                              chooser = buildDocumentChooser(fileChooserParams);
                          }

                          try {
                              startActivityForResult(chooser, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              fileCallback.onReceiveValue(null);
                              fileCallback = null;
                              Toast.makeText(
                                  MainActivity.this,
                                  "Tidak dapat membuka pemilih file",
                                  Toast.LENGTH_LONG
                              ).show();
                              return false;
                          }
                      }
                  });

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              private enum FileRequestType {
                  PHOTO,
                  DOCUMENT,
                  BACKUP
              }

              private FileRequestType detectRequestType(
                      WebChromeClient.FileChooserParams params
              ) {
                  String[] accepted = params.getAcceptTypes();

                  if (accepted != null) {
                      for (String raw : accepted) {
                          if (raw == null) continue;

                          String value = raw.toLowerCase(Locale.ROOT).trim();

                          if (value.contains(".rtns") || value.contains("rtns")) {
                              return FileRequestType.BACKUP;
                          }

                          if (value.contains("image/")) {
                              return FileRequestType.PHOTO;
                          }
                      }
                  }

                  return FileRequestType.DOCUMENT;
              }

              private Intent buildPhotoChooser(
                      WebChromeClient.FileChooserParams params
              ) {
                  Intent galleryIntent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  galleryIntent.addCategory(Intent.CATEGORY_OPENABLE);
                  galleryIntent.setType("image/*");
                  galleryIntent.putExtra(
                          Intent.EXTRA_ALLOW_MULTIPLE,
                          params.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE
                  );

                  List<Intent> extras = new ArrayList<>();
                  Intent cameraIntent = createCameraIntent();

                  if (cameraIntent != null) {
                      extras.add(cameraIntent);
                  }

                  Intent chooser = new Intent(Intent.ACTION_CHOOSER);
                  chooser.putExtra(Intent.EXTRA_INTENT, galleryIntent);
                  chooser.putExtra(Intent.EXTRA_TITLE, "Pilih foto");

                  if (!extras.isEmpty()) {
                      chooser.putExtra(
                              Intent.EXTRA_INITIAL_INTENTS,
                              extras.toArray(new Intent[0])
                      );
                  }

                  return chooser;
              }

              private Intent buildDocumentChooser(
                      WebChromeClient.FileChooserParams params
              ) {
                  Intent documentIntent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  documentIntent.addCategory(Intent.CATEGORY_OPENABLE);

                  String[] mimeTypes = resolveMimeTypes(params);
                  String primaryType = mimeTypes.length == 1
                          ? mimeTypes[0]
                          : "*/*";

                  documentIntent.setType(primaryType);

                  if (mimeTypes.length > 1) {
                      documentIntent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
                  }

                  documentIntent.putExtra(
                          Intent.EXTRA_ALLOW_MULTIPLE,
                          params.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE
                  );

                  Intent chooser = new Intent(Intent.ACTION_CHOOSER);
                  chooser.putExtra(Intent.EXTRA_INTENT, documentIntent);
                  chooser.putExtra(Intent.EXTRA_TITLE, "Pilih lampiran");

                  return chooser;
              }

              private Intent buildBackupChooser() {
                  Intent backupIntent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  backupIntent.addCategory(Intent.CATEGORY_OPENABLE);
                  backupIntent.setType("application/octet-stream");

                  String[] backupTypes = new String[]{
                          "application/octet-stream",
                          "application/json",
                          "text/plain"
                  };
                  backupIntent.putExtra(Intent.EXTRA_MIME_TYPES, backupTypes);

                  Intent chooser = new Intent(Intent.ACTION_CHOOSER);
                  chooser.putExtra(Intent.EXTRA_INTENT, backupIntent);
                  chooser.putExtra(Intent.EXTRA_TITLE, "Pilih cadangan Rutinitas+ (.rtns)");

                  return chooser;
              }

              private String[] resolveMimeTypes(
                      WebChromeClient.FileChooserParams params
              ) {
                  List<String> result = new ArrayList<>();
                  String[] accepted = params.getAcceptTypes();

                  if (accepted != null) {
                      for (String raw : accepted) {
                          if (raw == null || raw.trim().isEmpty()) continue;

                          String[] parts = raw.split(",");

                          for (String part : parts) {
                              String value = part.trim().toLowerCase(Locale.ROOT);

                              if (value.startsWith(".")) {
                                  String mime = extensionToMime(value);
                                  if (mime != null && !result.contains(mime)) {
                                      result.add(mime);
                                  }
                              } else if (value.contains("/")) {
                                  if (!result.contains(value)) {
                                      result.add(value);
                                  }
                              }
                          }
                      }
                  }

                  if (result.isEmpty()) {
                      result.add("*/*");
                  }

                  return result.toArray(new String[0]);
              }

              private String extensionToMime(String extension) {
                  switch (extension) {
                      case ".pdf":
                          return "application/pdf";
                      case ".doc":
                          return "application/msword";
                      case ".docx":
                          return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
                      case ".xls":
                          return "application/vnd.ms-excel";
                      case ".xlsx":
                          return "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
                      case ".ppt":
                          return "application/vnd.ms-powerpoint";
                      case ".pptx":
                          return "application/vnd.openxmlformats-officedocument.presentationml.presentation";
                      case ".txt":
                          return "text/plain";
                      case ".csv":
                          return "text/csv";
                      case ".zip":
                          return "application/zip";
                      case ".jpg":
                      case ".jpeg":
                          return "image/jpeg";
                      case ".png":
                          return "image/png";
                      default:
                          return null;
                  }
              }

              private void installDownloadHandler() {
                  String script =
                      "(function(){" +
                      "function pasang(w){" +
                      " try{" +
                      "  if(!w||w.__rutinitasDownloadFixed)return;" +
                      "  w.__rutinitasDownloadFixed=true;" +
