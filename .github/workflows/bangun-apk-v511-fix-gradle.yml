                      " try{" +
                      "  if(!w||!w.navigator||w.__rutinitasShareFixed)return;" +
                      "  w.__rutinitasShareFixed=true;" +
                      "  w.navigator.share=function(data){" +
                      "   return new Promise(function(res,rej){" +
                      "    try{" +
                           "     AndroidShare.bagikan((data&&data.title)||'', (data&&data.text)||'');" +
                      "     res();" +
                      "    }catch(e){ rej(e); }" +
                      "   });" +
                      "  };" +
                      " }catch(e){}" +
                      "}" +
                      "pasangBagikan(window);" +
                      "function pantauIframe(f){" +
                      " try{ if(f.__rpPasang) return; f.__rpPasang=1;" +
                      "  f.addEventListener('load',function(){" +
