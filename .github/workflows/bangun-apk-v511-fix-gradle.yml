                      "}" +
                      "function scan(){" +
                      " try{" +
                      "  document.querySelectorAll('iframe').forEach(function(f){" +
                      "   try{pasang(f.contentWindow);}catch(e){}" +
                      "   try{pasangBagikan(f.contentWindow);}catch(e){}" +
            "   try{pantauIframe(f);}catch(e){}" +
                      "  });" +
                      " }catch(e){}" +
                      "}" +
                      "scan();" +
                      "setInterval(scan,500);" +
                      "})();";

                  webView.evaluateJavascript(script, null);
              }

              public class DownloadBridge {
                  @JavascriptInterface
                  public void saveBase64(String filename, String mimeType, String base64Data) {
                      try {
                          pendingDownloadBytes = Base64.decode(base64Data, Base64.DEFAULT);
                          pendingDownloadName = sanitizeFilename(filename);
                          pendingDownloadMime =
                                  mimeType == null || mimeType.trim().isEmpty()
                                      ? "application/octet-stream"
                                      : mimeType.trim();

                          runOnUiThread(() -> {
                              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType(pendingDownloadMime);
                              intent.putExtra(Intent.EXTRA_TITLE, pendingDownloadName);

                              try {
                                  startActivityForResult(intent, SAVE_FILE_REQUEST);
                              } catch (Exception e) {
                                  pendingDownloadBytes = null;
                                  Toast.makeText(
                                      MainActivity.this,
                                      "Tidak dapat membuka lokasi penyimpanan",
                                      Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                      } catch (Exception e) {
                          pendingDownloadBytes = null;
                          runOnUiThread(() -> Toast.makeText(
                              MainActivity.this,
                              "File gagal diproses",
                              Toast.LENGTH_LONG
                          ).show());
                      }
                  }
              }

              /* Jembatan berbagi. WebView polos tidak mengenal navigator.share --
                 kelas ini yang memunculkan menu "Bagikan ke..." bawaan Android,
                 dipanggil lewat polyfill navigator.share yang disuntikkan ke tiap
                 iframe modul (lihat installDownloadHandler di atas). */
              public class ShareBridge {
                  @JavascriptInterface
                  public void bagikan(String title, String text) {
                      final String judul = title == null ? "" : title;
                      final String isi = text == null ? "" : text;
                      runOnUiThread(() -> {
                          try {
                              Intent share = new Intent(Intent.ACTION_SEND);
                              share.setType("text/plain");
                              if (!judul.trim().isEmpty()) {
                                  share.putExtra(Intent.EXTRA_SUBJECT, judul);
                              }
                              share.putExtra(Intent.EXTRA_TEXT, isi);
                              startActivity(Intent.createChooser(share, "Bagikan ke"));
                          } catch (Exception e) {
                              Toast.makeText(
                                  MainActivity.this,
                                  "Tidak dapat membuka menu bagikan",
                                  Toast.LENGTH_LONG
                              ).show();
                          }
                      });
                  }
              }

              private String sanitizeFilename(String filename) {
                  String name = filename == null ? "" : filename.trim();

                  if (name.isEmpty()) {
                      name = "Rutinitas-Plus";
                  }

                  return name.replaceAll("[\\\\/:*?\"<>|]", "_");
              }

              private Intent createCameraIntent() {
                  Intent cameraIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);

                  if (cameraIntent.resolveActivity(getPackageManager()) == null) {
                      return null;
                  }

                  try {
                      File imageDir = new File(getCacheDir(), "images");

                      if (!imageDir.exists() && !imageDir.mkdirs()) {
                          return null;
                      }

                      String timestamp = new SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                      ).format(new Date());

                      File imageFile = File.createTempFile(
                              "IMG_" + timestamp + "_",
                              ".jpg",
                              imageDir
                      );

                      cameraOutputUri = FileProvider.getUriForFile(
                              this,
                              getPackageName() + ".fileprovider",
                              imageFile
                      );

                      cameraIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraOutputUri);
                      cameraIntent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );

                      return cameraIntent;
                  } catch (IOException e) {
                      cameraOutputUri = null;
                      return null;
                  }
              }

              private static final int IZIN_NOTIF_REQUEST = 2001;

              private void siapkanKanalNotifikasi() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel kanal = new NotificationChannel(
                          "rutinitas_channel", "Pengingat Rutinitas",
                          NotificationManager.IMPORTANCE_HIGH);
                      kanal.setDescription("Pengingat rutinitas, tenggat, dan pendampingan anak");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(kanal);
                  }
              }

              private void mintaIzinNotifikasi() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) return;
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, IZIN_NOTIF_REQUEST);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  /* Ditolak atau diizinkan, aplikasi tetap jalan seperti biasa --
                     notifikasi sekadar tidak akan muncul kalau ditolak. */
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == SAVE_FILE_REQUEST) {
                      if (resultCode == RESULT_OK
                              && data != null
                              && data.getData() != null
                              && pendingDownloadBytes != null) {
                          Uri target = data.getData();

                          try (OutputStream output =
                                       getContentResolver().openOutputStream(target)) {
                              if (output == null) {
                                  throw new IOException("Output stream kosong");
                              }

                              output.write(pendingDownloadBytes);
                              output.flush();

                              Toast.makeText(
                                  this,
                                  "File berhasil disimpan",
                                  Toast.LENGTH_LONG
                              ).show();
                          } catch (Exception e) {
                              Toast.makeText(
                                  this,
                                  "Gagal menyimpan file",
                                  Toast.LENGTH_LONG
                              ).show();
                          }
                      }

                      pendingDownloadBytes = null;
                      return;
                  }

                  if (requestCode != FILE_CHOOSER_REQUEST || fileCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK) {
                      if (data == null || data.getData() == null) {
                          if (cameraOutputUri != null) {
                              results = new Uri[]{cameraOutputUri};
                          }
                      } else {
                          ClipData clipData = data.getClipData();

                          if (clipData != null) {
                              results = new Uri[clipData.getItemCount()];

                              for (int i = 0; i < clipData.getItemCount(); i++) {
                                  results[i] = clipData.getItemAt(i).getUri();
                              }
                          } else {
                              results = new Uri[]{data.getData()};
                          }
                      }
                  }

                  fileCallback.onReceiveValue(results);
                  fileCallback = null;
                  cameraOutputUri = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Siapkan kunci penanda tangan
        id: kunci
        env:
          KUNCI_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KUNCI_B64" ]; then
            echo "$KUNCI_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
            if [ ! -s "$RUNNER_TEMP/kunci.jks" ]; then
              echo "::error::KEYSTORE_BASE64 terisi tapi hasilnya kosong. Periksa penyalinan base64-nya."
              exit 1
            fi
            echo "ada=ya" >> $GITHUB_OUTPUT
            echo "Kunci rilis tersedia — APK ditandatangani dengan kunci tetap."
          else
            echo "ada=tidak" >> $GITHUB_OUTPUT
            echo "::warning::Belum ada KEYSTORE_BASE64, APK dibangun sebagai debug."
            echo "::warning::APK debug TIDAK bisa menimpa APK bertanda tangan lain — harus hapus pasang, dan data ikut hilang bila belum dicadangkan."
          fi

      - name: Build APK rilis
        if: steps.kunci.outputs.ada == 'ya'
        env:
          BERKAS_KUNCI: ${{ runner.temp }}/kunci.jks
          SANDI_KUNCI:  ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_KUNCI:  ${{ secrets.KEY_ALIAS }}
          SANDI_ALIAS:  ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Build APK debug
        if: steps.kunci.outputs.ada != 'ya'
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Ganti nama APK
        id: berkas
        run: |
          set -e
          mkdir -p hasil-apk
          ASAL=$(find app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$ASAL" ]; then ASAL=$(find app/build/outputs/apk -name '*.apk' | head -n 1); fi
          test -n "$ASAL" || { echo "::error::APK tidak ditemukan"; exit 1; }
          cp "$ASAL" hasil-apk/Rutinitas-Plus-v5.15.apk
          echo "Sumber : $ASAL"
          echo "Ukuran : $(( $(stat -c%s hasil-apk/Rutinitas-Plus-v5.15.apk) / 1024 )) KB"
          echo "Ditandatangani tetap : ${{ steps.kunci.outputs.ada }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-v5.15-APK
          path: hasil-apk/Rutinitas-Plus-v5.15.apk
          if-no-files-found: error
          retention-days: 30
