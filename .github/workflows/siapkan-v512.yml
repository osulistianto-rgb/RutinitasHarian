name: Siapkan title Rutinitas+ v5.12

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/siapkan-v512.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sinkronkan-title:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ubah title ke v5.12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          lama = '<title>Rutinitas+ v5.11</title>'
          baru = '<title>Rutinitas+ v5.12</title>'
          if lama in s:
              if s.count(lama) != 1:
                  raise SystemExit(f'Title v5.11 harus tepat satu, ditemukan {s.count(lama)}')
              p.write_text(s.replace(lama, baru, 1), encoding='utf-8')
          elif s.count(baru) != 1:
              raise SystemExit('Title tidak berada pada v5.11/v5.12 yang diharapkan')
          PY

      - name: Simpan index.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html sudah v5.12"
            exit 0
          fi
          git commit -m "fix: set title Rutinitas+ v5.12"
          git push origin HEAD:main
