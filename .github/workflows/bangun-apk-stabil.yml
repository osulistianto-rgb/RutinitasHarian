name: Bangun APK Rutinitas Plus — Stabil

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/bangun-apk-stabil.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Periksa index.html
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Rutinitas+" index.html
          grep -q "PUSTAKA_BERSAMA" index.html
          grep -q "PEKERJAAN_DASAR" index.html
          grep -q "pasangPustaka" index.html
          VERSI=$(grep -oE "Rutinitas\+ v[0-9]+\.[0-9]+(\.[0-9]+)?" index.html | head -n1 || true)
          echo "index.html siap. Versi: ${VERSI:-tidak diketahui}"

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buat proyek Android dari generator lama dan perbaiki Build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bangun-apk-v511-fix-gradle.yml')
          s=p.read_text(encoding='utf-8')
          a='      - name: Buat proyek Android\n'
          b='      - name: Siapkan kunci penanda tangan\n'
          if a not in s or b not in s:
              raise SystemExit('Blok generator Android tidak ditemukan')
          block=s.split(a,1)[1].split(b,1)[0]
          marker='        run: |\n'
          if marker not in block:
              raise SystemExit('Blok run generator tidak ditemukan')
          raw=block.split(marker,1)[1]
          lines=[]
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/buat-proyek.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/buat-proyek.sh

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rutinitasplus/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          if 'import android.os.Build;' not in s:
              needle='import android.os.Bundle;'
              if needle not in s:
                  raise SystemExit('Import Bundle tidak ditemukan di MainActivity')
              s=s.replace(needle, needle+'\nimport android.os.Build;', 1)
              p.write_text(s,encoding='utf-8')
          if 'import android.os.Build;' not in p.read_text(encoding='utf-8'):
              raise SystemExit('Gagal memasang import android.os.Build')
          print('MainActivity sudah memiliki import android.os.Build')
          PY

      - name: Siapkan kunci penanda tangan
        id: kunci
        env:
          KUNCI_B64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KUNCI_B64" ]; then
            echo "$KUNCI_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
            test -s "$RUNNER_TEMP/kunci.jks"
            echo "ada=ya" >> "$GITHUB_OUTPUT"
          else
            echo "ada=tidak" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK rilis
        if: steps.kunci.outputs.ada == 'ya'
        env:
          BERKAS_KUNCI: ${{ runner.temp }}/kunci.jks
          SANDI_KUNCI: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_KUNCI: ${{ secrets.KEY_ALIAS }}
          SANDI_ALIAS: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Build APK debug
        if: steps.kunci.outputs.ada != 'ya'
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Siapkan hasil APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasil-apk
          ASAL=$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$ASAL" ]; then
            ASAL=$(find app/build/outputs/apk -type f -name '*.apk' | head -n1)
          fi
          test -n "$ASAL"
          cp "$ASAL" hasil-apk/Rutinitas-Plus-Stabil.apk
          echo "APK: $ASAL"
          ls -lh hasil-apk/Rutinitas-Plus-Stabil.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-APK-Stabil
          path: hasil-apk/Rutinitas-Plus-Stabil.apk
          if-no-files-found: error
          retention-days: 30
