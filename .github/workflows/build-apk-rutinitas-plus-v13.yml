name: Build APK Rutinitas+

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        run: gradle --no-daemon assembleDebug

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rutinitas-Plus-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-v1.3-APK
          path: Rutinitas-Plus-v1.3.apk
          if-no-files-found: error
          retention-days: 30
