name: Terbitkan ke Pages

# Menerbitkan aplikasi tanpa menjalankan berkas uji.
# Pemeriksaan yang tersisa hanya yang cepat dan tidak butuh pemasangan apa pun:
# keberadaan berkas, kesahihan JSON, dan penanda isi di dalam index.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  periksa:
    name: Pemeriksaan cepat
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Berkas wajib ada dan tidak kosong
        run: |
          set -e
          KURANG=0
          for f in index.html manifest.webmanifest sw.js .nojekyll \
                   ikon-192.png ikon-512.png ikon-maskable-512.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Berkas hilang: $f"
              KURANG=1
            elif [ ! -s "$f" ] && [ "$f" != ".nojekyll" ]; then
              echo "::error::Berkas kosong: $f"
              KURANG=1
            fi
          done
          [ "$KURANG" -eq 0 ] || exit 1
          echo "Seluruh berkas wajib tersedia."

      - name: Ukuran index.html masuk akal
        run: |
          set -e
          UKURAN=$(stat -c%s index.html)
          KB=$((UKURAN/1024))
          echo "index.html: $KB KB"
          if [ "$UKURAN" -lt 204800 ]; then
            echo "::error::index.html hanya $KB KB — terlalu kecil, kemungkinan modulnya tidak ikut."
            exit 1
          fi
          if [ "$UKURAN" -gt 5242880 ]; then
            echo "::error::index.html $KB KB — terlalu besar, periksa apakah ada berkas besar tertanam tanpa sengaja."
            exit 1
          fi

      - name: manifest.webmanifest sah
        run: |
          set -e
          python3 - <<'PY'
          import json, sys
          m = json.load(open('manifest.webmanifest', encoding='utf-8'))
          kurang = [k for k in ('name','start_url','display','icons') if not m.get(k)]
          if kurang:
              print(f"::error::manifest kehilangan: {', '.join(kurang)}")
              sys.exit(1)
          if len(m['icons']) < 2:
              print("::error::manifest butuh setidaknya dua ikon")
              sys.exit(1)
          for i in m['icons']:
              import os
              if not os.path.exists(i['src']):
                  print(f"::error::ikon disebut manifest tapi berkasnya tidak ada: {i['src']}")
                  sys.exit(1)
          print(f"manifest sah — {len(m['icons'])} ikon, semuanya ada.")
          PY

      - name: Penanda isi aplikasi
        run: |
          set -e
          GAGAL=0
          periksa() {
            if grep -qF "$1" index.html; then
              echo "  ada    $2"
            else
              echo "::error::Penanda hilang: $2  (dicari: $1)"
              GAGAL=1
            fi
          }
          periksa 'manifest.webmanifest' 'tautan manifest'
          periksa "register('sw.js')"   'pendaftaran pekerja layanan'
          periksa 'PUSTAKA_BERSAMA'     'pustaka bersama'
          periksa 'pasangPustaka'       'pemasang pustaka ke modul'
          periksa 'PEKERJAAN_DASAR'     'mesin Kantor dan Pribadi'
          periksa 'simpanModulAktif'    'simpan sebelum berpindah modul'
          [ "$GAGAL" -eq 0 ] || exit 1
          echo "Seluruh penanda isi ditemukan."

      - name: Jumlah modul tertanam
        run: |
          set -e
          JUM=$(grep -o "decode('" index.html | wc -l)
          echo "Pemanggilan decode: $JUM"
          if [ "$JUM" -lt 5 ]; then
            echo "::error::Hanya $JUM modul tertanam — seharusnya minimal 5 (empat modul + pustaka bersama)."
            exit 1
          fi

  terbitkan:
    name: Terbitkan
    needs: periksa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Kemas berkas situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4

      - name: Ringkasan
        run: |
          echo "### Rutinitas+ diterbitkan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Alamat: ${{ steps.terbit.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Buka di ponsel, lalu pilih **Pasang aplikasi**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Berkas uji tidak dijalankan pada penerbitan ini." >> $GITHUB_STEP_SUMMARY
          echo "> Cobalah sendiri di ponsel: tambah foto, tutup aplikasi, buka lagi," >> $GITHUB_STEP_SUMMARY
          echo "> lalu buat satu cadangan." >> $GITHUB_STEP_SUMMARY
