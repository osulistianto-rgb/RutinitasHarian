name: Build Rutinitas Plus v5.11.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/build-apk-v511.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check index.html
        run: |
          test -f index.html
          grep -q "Rutinitas+ v5.11" index.html
          echo "index.html OK"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rutinitas/plus
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RutinitasPlus"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rutinitas.plus'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rutinitas.plus"
                  minSdk 24
                  targetSdk 34
                  versionCode 512
                  versionName "5.11.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Rutinitas+"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#35502F</item>
                  <item name="android:navigationBarColor">#F9FAF6</item>
                  <item name="android:statusBarColor">#233A1F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/rutinitas/plus/MainActivity.java <<'EOF'
          package com.rutinitas.plus;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("appassets.androidplatform.net".equals(uri.getHost())) {
                              String path = uri.getPath();
                              if (path != null && path.startsWith("/assets/")) {
                                  String asset = path.substring("/assets/".length());
                                  try {
                                      InputStream in = getAssets().open(asset);
                                      String mime = "text/plain";
                                      if (asset.endsWith(".html")) mime = "text/html";
                                      else if (asset.endsWith(".js")) mime = "application/javascript";
                                      else if (asset.endsWith(".css")) mime = "text/css";
                                      else if (asset.endsWith(".json") || asset.endsWith(".webmanifest")) mime = "application/json";
                                      else if (asset.endsWith(".png")) mime = "image/png";
                                      return new WebResourceResponse(mime, "UTF-8", in);
                                  } catch (IOException ignored) {}
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = filePathCallback;

                          Intent intent;
                          try {
                              intent = fileChooserParams.createIntent();
                          } catch (Exception e) {
                              intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                          }
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                              fileChooserParams.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);

                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              fileCallback.onReceiveValue(null);
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || fileCallback == null) return;

                  Uri[] hasil = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int n = data.getClipData().getItemCount();
                          hasil = new Uri[n];
                          for (int i = 0; i < n; i++) {
                              hasil[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      } else if (data.getData() != null) {
                          hasil = new Uri[]{data.getData()};
                      }
                  }
                  fileCallback.onReceiveValue(hasil);
                  fileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cmp index.html app/src/main/assets/index.html
          echo "Android project ready"

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Rutinitas-Plus-v5.11.1.apk
          ls -lh Rutinitas-Plus-v5.11.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-v5.11.1-APK
          path: Rutinitas-Plus-v5.11.1.apk
          if-no-files-found: error
          retention-days: 30
