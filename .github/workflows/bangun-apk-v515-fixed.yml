name: Bangun APK Rutinitas Plus v5.15.1 Notifikasi

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bangun-apk-v515-fixed.yml"
      - "tools/perbaiki-notifikasi-v5151.py"
      - "tools/patch-notif-java-v5151.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Periksa index.html
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Rutinitas+" index.html
          grep -q "PUSTAKA_BERSAMA" index.html
          grep -q "PEKERJAAN_DASAR" index.html
          grep -q "pasangPustaka" index.html
          echo "index.html siap dibangun"

      - name: Sambungkan JavaScript ke notifikasi native
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/perbaiki-notifikasi-v5151.py index
          grep -q "Rutinitas+ v5.15.1" index.html
          echo "Patch JavaScript notifikasi selesai"

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buat proyek Android dan lengkapi bridge notifikasi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bangun-apk-v511-fix-gradle.yml')
          s=p.read_text(encoding='utf-8')
          a='      - name: Buat proyek Android\n'
          b='      - name: Siapkan kunci penanda tangan\n'
          if a not in s or b not in s:
              raise SystemExit('Blok generator Android tidak ditemukan')
          block=s.split(a,1)[1].split(b,1)[0]
          marker='        run: |\n'
          if marker not in block:
              raise SystemExit('Blok run generator tidak ditemukan')
          raw=block.split(marker,1)[1]
          lines=[]
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          needle='import android.os.Bundle;\n'
          if needle not in script:
              raise SystemExit('Import Bundle MainActivity tidak ditemukan')
          if 'import android.os.Build;\n' not in script:
              script=script.replace(needle, needle+'import android.os.Build;\n', 1)
          Path('/tmp/buat-proyek.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/buat-proyek.sh
          python3 tools/patch-notif-java-v5151.py
          echo "Bridge notifikasi native selesai dipatch"

      - name: Siapkan kunci penanda tangan
        id: kunci
        env:
          KUNCI_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KUNCI_B64" ]; then
            echo "$KUNCI_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
            test -s "$RUNNER_TEMP/kunci.jks"
            echo "ada=ya" >> $GITHUB_OUTPUT
          else
            echo "ada=tidak" >> $GITHUB_OUTPUT
          fi

      - name: Build APK rilis
        if: steps.kunci.outputs.ada == 'ya'
        env:
          BERKAS_KUNCI: ${{ runner.temp }}/kunci.jks
          SANDI_KUNCI:  ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_KUNCI:  ${{ secrets.KEY_ALIAS }}
          SANDI_ALIAS:  ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Build APK debug
        if: steps.kunci.outputs.ada != 'ya'
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Siapkan hasil APK
        run: |
          set -euo pipefail
          mkdir -p hasil-apk
          ASAL=$(find app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$ASAL" ]; then ASAL=$(find app/build/outputs/apk -name '*.apk' | head -n1); fi
          test -n "$ASAL"
          cp "$ASAL" hasil-apk/Rutinitas-Plus-v5.15.1.apk
          echo "APK: $ASAL"
          echo "Ukuran: $(( $(stat -c%s hasil-apk/Rutinitas-Plus-v5.15.1.apk) / 1024 )) KB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-v5.15.1-APK-Notifikasi
          path: hasil-apk/Rutinitas-Plus-v5.15.1.apk
          if-no-files-found: error
          retention-days: 30
