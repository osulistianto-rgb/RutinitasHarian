name: Build Rutinitas Plus APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check index.html
        shell: bash
        run: |
          test -s index.html || { echo "ERROR: index.html tidak ditemukan/kosong"; exit 1; }
          grep -qi "<html" index.html || { echo "ERROR: index.html bukan HTML yang valid"; exit 1; }

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/rutinitasplus/app
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RutinitasPlus"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rutinitasplus.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.rutinitasplus.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 511
                  versionName "5.11"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:allowBackup="true"
                  android:label="Rutinitas+"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#35502F</item>
                  <item name="android:navigationBarColor">#F9FAF6</item>
                  <item name="android:statusBarColor">#233A1F</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/rutinitasplus/app/MainActivity.java <<'EOF'
          package com.rutinitasplus.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              private final ActivityResultLauncher<Intent> filePicker =
                  registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                      Uri[] uris = null;
                      if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                          Intent data = result.getData();
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              uris = new Uri[n];
                              for (int i = 0; i < n; i++) {
                                  uris[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              uris = new Uri[]{data.getData()};
                          }
                      }
                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(uris);
                          fileCallback = null;
                      }
                  });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;

                          Intent intent;
                          try {
                              intent = params.createIntent();
                          } catch (Exception e) {
                              intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.setType("*/*");
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                          }

                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          filePicker.launch(intent);
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Rutinitas-Plus-v5.11.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-Plus-v5.11
          path: Rutinitas-Plus-v5.11.apk
          if-no-files-found: error
          retention-days: 30
