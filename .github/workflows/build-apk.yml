name: Build APK Lapsit Pusdiktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - index.html
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil isi repository
        uses: actions/checkout@v4

      - name: Pastikan index.html tersedia
        shell: bash
        run: |
          test -f index.html || {
            echo "ERROR: index.html tidak ditemukan di folder utama repository."
            exit 1
          }

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android Platform 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Buat pembungkus Android tanpa mengubah index.html
        shell: bash
        run: |
          mkdir -p app/src/main/java/id/mil/tniad/pusdiktop/lapsit
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LapsitPusdiktop"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.mil.tniad.pusdiktop.lapsit'
              compileSdk 35

              defaultConfig {
                  applicationId 'id.mil.tniad.pusdiktop.lapsit'
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          : > app/proguard-rules.pro

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Lapsit Pusdiktop</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="hijau_tua">#213B24</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.LapsitPusdiktop" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">@color/hijau_tua</item>
                  <item name="android:statusBarColor">@color/hijau_tua</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.LapsitPusdiktop"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/id/mil/tniad/pusdiktop/lapsit/MainActivity.java <<'EOF'
          package id.mil.tniad.pusdiktop.lapsit;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private WebView webView;
              private ValueCallback<Uri[]> fileChooserCallback;

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("file".equalsIgnoreCase(uri.getScheme()) ||
                              "data".equalsIgnoreCase(uri.getScheme()) ||
                              "blob".equalsIgnoreCase(uri.getScheme())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectDownloadBridge();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (fileChooserCallback != null) {
                              fileChooserCallback.onReceiveValue(null);
                          }
                          fileChooserCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  fileChooserParams.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              fileChooserCallback = null;
                              Toast.makeText(MainActivity.this,
                                      "Pemilih file tidak tersedia.", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void injectDownloadBridge() {
                  String script = "(function(){" +
                          "if(window.__androidDownloadReady)return;" +
                          "window.__androidDownloadReady=true;" +
                          "var asli=HTMLAnchorElement.prototype.click;" +
                          "HTMLAnchorElement.prototype.click=function(){" +
                          "var a=this;" +
                          "if(a.download&&a.href){" +
                          "fetch(a.href).then(function(r){return r.blob();}).then(function(b){" +
                          "var fr=new FileReader();" +
                          "fr.onloadend=function(){AndroidApp.saveBase64(fr.result,a.download||'unduhan',b.type||'application/octet-stream');};" +
                          "fr.readAsDataURL(b);" +
                          "}).catch(function(){asli.call(a);});" +
                          "return;" +
                          "}" +
                          "return asli.call(a);" +
                          "};" +
                          "})();";
                  webView.evaluateJavascript(script, null);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || fileChooserCallback == null) {
                      return;
                  }

                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          ArrayList<Uri> uris = new ArrayList<>();
                          for (int i = 0; i < count; i++) {
                              uris.add(data.getClipData().getItemAt(i).getUri());
                          }
                          results = uris.toArray(new Uri[0]);
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }
                  }

                  fileChooserCallback.onReceiveValue(results);
                  fileChooserCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void saveBase64(String dataUrl, String requestedName, String mimeType) {
                      runOnUiThread(() -> saveDownloadedFile(dataUrl, requestedName, mimeType));
                  }
              }

              private void saveDownloadedFile(String dataUrl, String requestedName, String mimeType) {
                  try {
                      int comma = dataUrl.indexOf(',');
                      if (comma < 0) throw new IllegalArgumentException("Data tidak valid");

                      byte[] bytes = Base64.decode(dataUrl.substring(comma + 1), Base64.DEFAULT);
                      String fileName = safeFileName(requestedName, mimeType);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE,
                                  mimeType == null || mimeType.isEmpty()
                                          ? "application/octet-stream" : mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS + "/Lapsit Pusdiktop");
                          values.put(MediaStore.Downloads.IS_PENDING, 1);

                          Uri uri = getContentResolver().insert(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new IllegalStateException("Gagal membuat file");

                          try (OutputStream output = getContentResolver().openOutputStream(uri)) {
                              if (output == null) throw new IllegalStateException("Gagal membuka file");
                              output.write(bytes);
                          }

                          values.clear();
                          values.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, values, null, null);
                      } else {
                          File directory = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (directory == null) throw new IllegalStateException("Folder tidak tersedia");
                          if (!directory.exists() && !directory.mkdirs()) {
                              throw new IllegalStateException("Folder gagal dibuat");
                          }
                          try (FileOutputStream output = new FileOutputStream(new File(directory, fileName))) {
                              output.write(bytes);
                          }
                      }

                      Toast.makeText(this,
                              "File tersimpan: " + fileName,
                              Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this,
                              "Gagal menyimpan file: " + e.getMessage(),
                              Toast.LENGTH_LONG).show();
                  }
              }

              private String safeFileName(String requestedName, String mimeType) {
                  String name = requestedName == null ? "unduhan" : requestedName.trim();
                  name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                  if (name.isEmpty()) name = "unduhan";

                  if (!name.contains(".")) {
                      String mime = mimeType == null ? "" : mimeType.toLowerCase(Locale.ROOT);
                      if (mime.contains("jpeg") || mime.contains("jpg")) name += ".jpg";
                      else if (mime.contains("png")) name += ".png";
                      else if (mime.contains("json")) name += ".json";
                      else if (mime.contains("text")) name += ".txt";
                  }
                  return name;
              }
          }
          EOF

      - name: Bangun APK debug
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Siapkan nama APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Lapsit-Pusdiktop-v4.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lapsit-Pusdiktop-v4-APK
          path: Lapsit-Pusdiktop-v4.apk
          if-no-files-found: error
          retention-days: 30
