name: Uji dan Terbitkan

# Berjalan saat ada perubahan didorong ke cabang utama,
# saat ada permintaan tarik, dan bisa dijalankan manual.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Izin minimum yang dibutuhkan untuk menerbitkan ke GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan pada satu waktu. Antrean lama tidak dibatalkan
# supaya penerbitan yang sedang berjalan tidak terpotong di tengah.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  uji:
    name: Pengujian otomatis
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang kebutuhan pengujian
        run: |
          # Pasang langsung, tanpa bergantung pada package.json.
          # Repositori ini boleh berisi index.html dan uji.js saja.
          npm install --no-audit --no-fund --no-save jsdom@^24 fake-indexeddb@^5

      - name: Jalankan pengujian
        run: node uji.js

      - name: Periksa berkas wajib
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js .nojekyll \
                   ikon-192.png ikon-512.png ikon-maskable-512.png; do
            if [ ! -f "$f" ]; then
              echo "Berkas wajib hilang: $f"
              exit 1
            fi
          done
          echo "Seluruh berkas wajib tersedia."

      - name: Periksa ukuran berkas
        run: |
          UKURAN=$(stat -c%s index.html)
          echo "Ukuran index.html: $((UKURAN/1024)) KB"
          if [ "$UKURAN" -gt 5242880 ]; then
            echo "index.html melebihi 5 MB — periksa apakah ada berkas besar yang tidak sengaja tertanam."
            exit 1
          fi

  terbitkan:
    name: Terbitkan ke GitHub Pages
    # Hanya berjalan bila pengujian lulus, dan hanya dari cabang utama.
    needs: uji
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Kemas berkas situs
        uses: actions/upload-pages-artifact@v3
        with:
          # Seluruh isi repositori diterbitkan apa adanya.
          path: '.'

      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4

      - name: Ringkasan
        run: |
          echo "### Rutinitas+ diterbitkan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Alamat: ${{ steps.terbit.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Buka di ponsel, lalu pilih **Pasang aplikasi** atau **Tambahkan ke Layar Utama**." >> $GITHUB_STEP_SUMMARY
